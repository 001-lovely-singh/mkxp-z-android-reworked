plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        // Package name AnyPlay looks for (RgssLauncher.PLUGIN_PACKAGE).
        // Only applicationId changes; `namespace` above must stay com.hatkid.mkxpz
        // because the Java package / native JNI code use it.
        applicationId "com.anyplay.rgssplugin"
        minSdk 23
        targetSdk 33
        versionCode 11
        versionName "0.1.1"
        archivesBaseName = "mkxp-z-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // AnyPlay: an UNSIGNED APK cannot be installed on Android ("package appears
            // to be invalid"). Sign the release build with the auto-generated debug key so
            // the APK installs. (Fine for personal use; use your own keystore for a public release.)
            signingConfig signingConfigs.debug
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // You can build also 'x86' and 'x86_64' if you want (useful for AVD debugging)
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
