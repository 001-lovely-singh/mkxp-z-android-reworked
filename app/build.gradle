plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        // Package name AnyPlay looks for (RgssLauncher.PLUGIN_PACKAGE).
        // Only applicationId changes; `namespace` above must stay com.hatkid.mkxpz
        // because the Java package / native JNI code use it.
        applicationId "com.anyplay.rgssplugin"
        minSdk 23
        targetSdk 33
        versionCode 31
        versionName "0.1.4"
        archivesBaseName = "mkxp-z-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    // AnyPlay: ONE fixed signing key, stored in the repo (app/anyplay-rgss.keystore).
    // GitHub Actions makes a brand-new random debug key on every run, so every build
    // had a different signature and Android refused to update the old install
    // ("uninstall first"). With this fixed key, every new APK installs OVER the old one.
    signingConfigs {
        anyplay {
            storeFile file('anyplay-rgss.keystore')
            storePassword 'anyplay123'
            keyAlias 'anyplay'
            keyPassword 'anyplay123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // AnyPlay: an UNSIGNED APK cannot be installed on Android ("package appears
            // to be invalid"), so sign with the fixed AnyPlay key defined above.
            signingConfig signingConfigs.anyplay
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // You can build also 'x86' and 'x86_64' if you want (useful for AVD debugging)
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // AnyPlay overlay is written in Kotlin
    kotlinOptions {
        jvmTarget = '1.8'
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    ndkVersion '23.2.8568313'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'androidx.core:core-ktx:1.9.0'
}
